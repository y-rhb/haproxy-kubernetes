---
# Extrait : le playbook appelant prépare le répertoire, les variables et le certificat de test.
- name: Render base configuration
  ansible.builtin.template:
    src: roles/haproxy/templates/haproxy.cfg.j2
    dest: "{{ render_dir }}/haproxy.cfg"
    mode: '0644'
  vars:
    haproxy_tls_cert_path: "{{ render_dir }}/render.pem"

- name: Render conf.d fragments
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ render_dir }}/conf.d/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: '0644'
  loop: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/roles/haproxy/templates/conf.d/*.cfg.j2', wantlist=True) }}"

- name: Validate full configuration (haproxy -c)
  ansible.builtin.command:
    cmd: haproxy -c -f {{ render_dir }}/haproxy.cfg -f {{ render_dir }}/conf.d
  changed_when: false
